trigger: none

pr:
  branches:
    include:
      - main

variables:
  PNPM_CACHE_FOLDER: $(Pipeline.Workspace)/.pnpm-store

jobs:
  - job: build_api
    displayName: "NestJS API — Lint, Build & Test"
    pool:
      vmImage: "ubuntu-latest"
    steps:
      - task: UseNode@1
        inputs:
          version: "26.x"
        displayName: "Install Node 26"

      - script: corepack enable && corepack prepare pnpm@11.3.0 --activate
        displayName: "Enable pnpm"

      - script: pnpm config set store-dir $(PNPM_CACHE_FOLDER)
        displayName: "Set pnpm Store Location"

      - task: Cache@2
        inputs:
          key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
          path: $(PNPM_CACHE_FOLDER)
        displayName: "Cache pnpm Store"

      - script: pnpm install --frozen-lockfile
        displayName: "Install Dependencies"

      - script: pnpm prisma:generate
        displayName: "Generate Prisma Client"
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          APP_DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - script: pnpm lint
        displayName: "Lint Code"

      - script: pnpm build
        displayName: "Build NestJS App"

      - script: pnpm test
        displayName: "Run Unit Tests"
