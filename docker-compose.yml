services:
  postgres:
    image: postgres:16-alpine
    container_name: pn_console_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pn_console}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pn_console}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pn_console}"]
      interval: 5s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
