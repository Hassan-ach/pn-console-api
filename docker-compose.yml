services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: pn_console_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-pn_console}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pn_console}
            POSTGRES_DB: postgres
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./db/init:/docker-entrypoint-initdb.d
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pn_console}']
            interval: 5s
            timeout: 5s
            retries: 3

    mailhog:
        image: mailhog/mailhog:latest
        container_name: pn_console_mailhog
        restart: unless-stopped
        ports:
            - '1025:1025'
            - '8025:8025'

    redis:
        image: redis:7-alpine
        container_name: pn_console_redis
        restart: unless-stopped
        ports:
            - '6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 3

    keycloak:
        image: quay.io/keycloak/keycloak:latest
        container_name: pn_console_keycloak
        restart: unless-stopped
        depends_on:
            - postgres
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: admin
            KC_HOSTNAME: localhost
        ports:
            - '8080:8080'
        command: start-dev

volumes:
    postgres_data:
